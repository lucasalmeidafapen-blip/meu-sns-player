<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SNES Player</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="game"></div>

    <script>
        // Onde o EmulatorJS será exibido
        EJS_player = "#game";

        // Super Nintendo
        EJS_core = "snes";

        // Sua ROM
        EJS_gameUrl = "roms/game.sfc";

        // Nome do jogo
        EJS_gameName = "Super Nintendo";

        // Usar a versão Stable oficial do EmulatorJS
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

        // Iniciar automaticamente
        EJS_startOnLoaded = true;
        EJS_browserMode = "mobile";
        EJS_controlScheme = "snes";
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>

</html>
