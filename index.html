<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SNES Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <header>
            <h1>🎮 SNES PLAYER</h1>
            <span>Carregando jogo...</span>
        </header>

        <div id="game"></div>

    </div>


    <script>
        // Elemento onde o EmulatorJS será exibido
        EJS_player = "#game";

        // Core do Super Nintendo
        EJS_core = "snes";

        // ROM
        EJS_gameUrl = "roms/game.sfc";

        // Nome do jogo
        EJS_gameName = "SNES Game";

        // Local dos arquivos do EmulatorJS
        EJS_pathtodata = "emulatorjs/data/";

        // Inicialização automática
        EJS_startOnLoaded = true;

        // Controles e opções
        EJS_defaultOptions = {
            "fullscreen": true,
            "save-state": true
        };
    </script>


    <script src="emulatorjs/data/loader.js"></script>

</body>

</html>
