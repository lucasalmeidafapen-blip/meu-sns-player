<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>SNES Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <header>
            <h1>🎮 SNES PLAYER</h1>
            <p>Carregando jogo...</p>
        </header>

        <main>
            <div id="game"></div>
        </main>

    </div>

    <script>
        /*
         * CONFIGURAÇÃO DO EMULATORJS
         */

        EJS_player = "#game";

        // Núcleo do Super Nintendo
        EJS_core = "snes";

        // ROM que será carregada automaticamente
        EJS_gameUrl = "roms/game.sfc";

        // Nome exibido pelo emulador
        EJS_gameName = "SNES Game";

        // Pasta dos arquivos do EmulatorJS
        EJS_pathtodata = "emulatorjs/data/";

        // Iniciar automaticamente
        EJS_startOnLoaded = true;

        // Permitir salvar estados
        EJS_defaultOptions = {
            "save-state": true,
            "fullscreen": true
        };
    </script>

    <script src="emulatorjs/data/loader.js"></script>

</body>
</html>
